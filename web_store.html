<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grand Hustles - Store</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#0f0f12; color:#eee; margin:0; padding:0; }
    .header { background:linear-gradient(90deg,#1f1f2b,#3a0b0b); padding:30px; text-align:center; }
    .logo { font-family:monospace; color:#ffdd57; font-size:28px; letter-spacing:4px; }
    .subtitle { color:#ddd; margin-top:8px; }
    .container { padding:20px; max-width:1100px; margin:0 auto; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
    .card { background:#151518; border:1px solid #222; border-radius:8px; padding:12px; transition:transform .15s; }
    .card:hover { transform:translateY(-6px); box-shadow:0 6px 18px rgba(0,0,0,0.6); }
    .product-image { width:100%; height:160px; object-fit:cover; border-radius:6px; }
    .p-title { font-weight:700; color:#fff; margin:8px 0 4px; }
    .p-price { color:#ffdd57; font-weight:700; }
    .p-inst { color:#9ad3ff; font-size:14px; margin-top:6px; }
    .buy { display:inline-block; margin-top:10px; padding:8px 12px; background:#ff3b3b; color:#fff; border-radius:6px; text-decoration:none; }
    .footer { text-align:center; color:#888; padding:20px; }
    /* Admin UI */
    #admin-btn { position:fixed; right:18px; bottom:18px; background:#222; color:#fff; border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.5); }
    #admin-modal { position:fixed; right:18px; bottom:74px; width:320px; background:#0f0f12; border:1px solid #333; padding:12px; border-radius:8px; display:none; z-index:2000; }
    #admin-modal input, #admin-modal button, #admin-modal textarea { width:100%; box-sizing:border-box; margin:6px 0; padding:8px; border-radius:6px; border:1px solid #333; background:#121214; color:#eee; }
    .admin-product { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:6px 0; border-bottom:1px dashed #222; }
    .admin-product button { width:74px; background:#c0392b; border:none; color:#fff; padding:6px; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">GRAND HUSTLES</div>
    <div class="subtitle">Streetwear drops • Edición limitada • @grand_hustle_studio</div>
  </div>
  <div class="container">
    <h2 style="color:#ffdd57">Colección actual</h2>
    <div class="grid" id="products"></div>
  </div>
  <div class="footer">Sigue en Instagram: <a href="https://www.instagram.com/grand_hustle_studio" target="_blank">@grand_hustle_studio</a></div>

  <!-- Admin floating button + modal -->
  <div id="admin-btn" title="Admin">⚙️</div>
  <div id="admin-modal" aria-hidden="true">
    <div style="font-weight:700; margin-bottom:6px;">Panel Admin (web)</div>
    <input id="api-key" type="password" placeholder="API Key" />
    <textarea id="new-product" placeholder="Nuevo producto (ej: Cool Tee - $99)"></textarea>
    <button id="add-product">Agregar producto</button>
    <div style="margin-top:8px; font-weight:600;">Productos</div>
    <div id="admin-products" style="max-height:220px; overflow:auto; margin-top:6px;"></div>
  </div>

  <script>
    // Mapea títulos a imágenes (fallback placeholders)
    const imageMap = {
      'Hellstar Tee': 'https://via.placeholder.com/600x400/1f1f2b/ffdd57?text=Hellstar+Tee',
      'BAPE Sta Tee': 'https://via.placeholder.com/600x400/0b4f6c/fff?text=BAPE+Sta+Tee',
      'Barbas/Chucky Hat': 'https://via.placeholder.com/600x400/2b2b2b/fff?text=Barbas+Hat',
      'Limited Drop Hoodie': 'https://via.placeholder.com/600x400/3a0b0b/ffdd57?text=Limited+Hoodie'
    };

    const container = document.getElementById('products');

    function renderProducts(products) {
      container.innerHTML = '';
      products.forEach(p => {
        // p is string like "Title - $Price" or object
        let title = p;
        let price = '';
        if (typeof p === 'string') {
          const parts = p.split(' - ');
          title = parts[0];
          price = parts[1] ? parts[1] : '';
        } else if (typeof p === 'object') {
          title = p.title || '';
          price = p.price || '';
        }

        // Determine image URL: prefer explicit product.image (if object), then mapped images, otherwise use local placeholder
        let img = '/images/placeholder.jpg';
        if (typeof p === 'object' && p.image && typeof p.image === 'string' && p.image.trim() !== '') {
          img = p.image;
        } else if (imageMap[title]) {
          img = imageMap[title];
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="product-image" src="${img}" alt="${title}" />
          <div class="p-title">${title}</div>
          <div class="p-price">${price}</div>
          <div class="p-inst">Disponible: Edición limitada</div>
          <a class="buy" href="https://www.instagram.com/grand_hustle_studio" target="_blank" title="Order via Instagram" aria-label="Order via Instagram">Instagram</a>
        `;
        container.appendChild(card);
      });
    }

    // Load initial products from backend
    function loadProducts() {
      fetch('/api/products')
        .then(r => r.json())
        .then(data => {
          const products = data && data.products ? data.products : [];
          renderProducts(products);
        })
        .catch(err => {
          console.error('Failed to load products', err);
          renderProducts([]);
        });
    }

    // Listen for server-sent events to update automatically
    function setupSSE() {
      if (!window.EventSource) return;
      const es = new EventSource('/events');
      es.addEventListener('update', e => {
        console.log('Products updated');
        loadProducts();
      });
      es.onopen = () => console.log('SSE connected');
      es.onerror = () => console.log('SSE error');
    }

    loadProducts();
    setupSSE();

    // Admin UI
    const adminBtn = document.getElementById('admin-btn');
    const adminModal = document.getElementById('admin-modal');
    const apiKeyInput = document.getElementById('api-key');
    const addBtn = document.getElementById('add-product');
    const adminProductsDiv = document.getElementById('admin-products');

    let apiKey = '';

    adminBtn.addEventListener('click', () => {
      adminModal.style.display = adminModal.style.display === 'block' ? 'none' : 'block';
      if (adminModal.style.display === 'block') renderAdminProducts();
    });

    function renderAdminProducts() {
      fetch('/api/products').then(r => r.json()).then(data => {
        const products = data && data.products ? data.products : [];
        adminProductsDiv.innerHTML = '';
        products.forEach((p, idx) => {
          const item = document.createElement('div');
          item.className = 'admin-product';
          const span = document.createElement('div');
          span.textContent = `${idx+1}. ${p}`;
          const del = document.createElement('button');
          del.textContent = 'Eliminar';
          del.addEventListener('click', () => deleteProductWeb(idx+1));
          item.appendChild(span);
          item.appendChild(del);
          adminProductsDiv.appendChild(item);
        });
      });
    }

    addBtn.addEventListener('click', () => {
      const val = document.getElementById('new-product').value.trim();
      if (!val) return alert('Escribe el producto');
      if (!apiKey) apiKey = apiKeyInput.value.trim();
      if (!apiKey) return alert('Ingresa API Key');
      fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey }, body: JSON.stringify({ product: val }) })
        .then(r => r.json())
        .then(resp => {
          if (resp && resp.ok) {
            document.getElementById('new-product').value = '';
            renderAdminProducts();
            loadProducts();
          } else {
            alert('Error: ' + (resp && resp.error ? resp.error : 'unknown'));
          }
        }).catch(e => alert('Network error'));
    });

    function deleteProductWeb(index) {
      if (!apiKey) apiKey = apiKeyInput.value.trim();
      if (!apiKey) return alert('Ingresa API Key');
      fetch(`/api/products/${index}`, { method: 'DELETE', headers: { 'x-api-key': apiKey } })
        .then(r => r.json())
        .then(resp => {
          if (resp && resp.ok) {
            renderAdminProducts();
            loadProducts();
          } else {
            alert('Error: ' + (resp && resp.error ? resp.error : 'unknown'));
          }
        }).catch(e => alert('Network error'));
    }
  </script>
</body>
</html>

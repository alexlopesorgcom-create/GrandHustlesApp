<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grand Hustles - Google Sign-In Demo</title>
</head>
<body>
  <h1>Iniciar sesión con Google (demo)</h1>
  <div id="g_id_onload"
       data-client_id="REPLACE_WITH_YOUR_CLIENT_ID.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div id="user-info" style="margin-top:20px;"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function handleCredentialResponse(response) {
      // response.credential is a JWT ID token
      // For demo only: decode payload client-side (not secure for production)
      function parseJwt (token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      };

      const payload = parseJwt(response.credential);
      const el = document.getElementById('user-info');
      el.innerHTML = '<strong>Usuario:</strong> ' + (payload.name || payload.email) + '<br>' +
                     '<strong>Email:</strong> ' + (payload.email || '') + '<br>' +
                     '<pre>' + JSON.stringify(payload, null, 2) + '</pre>';
    }
  </script>

  <p>Instrucciones:
    <ol>
      <li>Crea un OAuth 2.0 Client ID en Google Cloud Console (tipo Aplicación web).</li>
      <li>Reemplaza REPLACE_WITH_YOUR_CLIENT_ID en el archivo con tu Client ID.</li>
      <li>Sirve este archivo desde un host seguro (https) o usa <code>http://localhost</code> para pruebas.</li>
    </ol>
  </p>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAND HUSTLES - Streetwear Drops</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #canvas3d {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .main-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* BARRA NAVEGACIÓN */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .nav-icons {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .cart-btn-icon {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      position: relative;
    }

    .cart-count {
      position: absolute;
      top: -6px; right: -10px;
      background: #ff3333;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 6px;
    }

    /* SECCIÓN PRODUCTOS */
    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 35px 0 20px;
      text-transform: uppercase;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    .img-box {
      width: 100%;
      height: 280px;
      background: #111;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .prod-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .prod-price {
      color: #ccc;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .size-select {
      width: 100%;
      padding: 10px;
      background: #111;
      border: 1px solid #333;
      color: white;
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .add-cart-btn {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-cart-btn:hover { background: #dddddd; }

    /* POP-UP DE ENTRADA (Early Access) */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup-content {
      background: #000;
      border: 1px solid #333;
      width: 100%;
      max-width: 440px;
      padding: 40px 25px;
      text-align: center;
      border-radius: 8px;
      position: relative;
    }

    .popup-close {
      position: absolute;
      top: 15px; right: 20px;
      background: none; border: none;
      color: #888; font-size: 1.5rem;
      cursor: pointer;
    }

    .popup-h2 {
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .popup-p {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .popup-input {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      color: white;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .popup-btn {
      width: 100%;
      padding: 14px;
      background: #ff3333;
      color: white;
      font-weight: 900;
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* CARRITO LATERAL (Slide-out Cart) */
    .cart-drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 100%; max-width: 400px;
      height: 100vh;
      background: #0a0a0a;
      border-left: 1px solid #222;
      z-index: 900;
      padding: 25px;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }

    .cart-drawer.open { right: 0; }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 15px;
    }

    .cart-item-img {
      width: 70px; height: 70px;
      background: #222; object-fit: cover;
      border-radius: 4px;
    }

    .cart-item-info h4 { font-size: 0.95rem; }
    .cart-item-info p { font-size: 0.85rem; color: #888; margin-top: 4px; }

    .cart-footer {
      border-top: 1px solid #222;
      padding-top: 15px;
    }

    .cart-subtotal {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      font-weight: 900;
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* CHECKOUT MODAL */
    .checkout-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .checkout-box {
      background: #111;
      border: 1px solid #333;
      width: 100%; max-width: 500px;
      padding: 30px;
      border-radius: 8px;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px;
    }

    /* BOTÓN TUERCA ADMIN */
    .admin-trigger {
      position: fixed; bottom: 20px; left: 20px; z-index: 800;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; width: 45px; height: 45px; border-radius: 50%;
      cursor: pointer; font-size: 1.2rem;
    }

    .admin-panel {
      position: fixed; top: 0; left: -360px;
      width: 320px; height: 100vh; background: #080808;
      border-right: 1px solid #222; z-index: 850; padding: 25px;
      transition: left 0.3s ease; overflow-y: auto;
    }
    .admin-panel.open { left: 0; }
  </style>
</head>
<body>

  <canvas id="canvas3d"></canvas>

  <div class="main-wrapper">
    <nav>
      <div class="logo">GRAND HUSTLES</div>
      <div class="nav-icons">
        <button class="cart-btn-icon" onclick="toggleCart()">
          🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </nav>

    <div class="section-title">ALL PRODUCTS</div>
    <div class="grid-container" id="productsGrid"></div>
  </div>

  <!-- POP-UP ACCESO ANTICIPADO -->
  <div class="popup-overlay" id="earlyAccessPopup">
    <div class="popup-content">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <div class="popup-h2">GET EARLY ACCESS TO NEW DROPS</div>
      <div class="popup-p">JOIN THE GRAND HUSTLES LIST FOR EXCLUSIVE DROPS & OFFERS.</div>
      <input type="text" class="popup-input" placeholder="Phone or Email">
      <button class="popup-btn" onclick="closePopup()">SUBSCRIBE NOW</button>
    </div>
  </div>

  <!-- CARRITO LATERAL DESLIZABLE -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3 style="font-weight: 900;">SHOPPING CART</h3>
      <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div class="cart-items" id="cartItemsContainer"></div>
    <div class="cart-footer">
      <div class="cart-subtotal">
        <span>SUBTOTAL</span>
        <span id="cartSubtotal">$0.00 USD</span>
      </div>
      <button class="checkout-btn" onclick="openCheckout()">CHECKOUT</button>
    </div>
  </div>

  <!-- MODAL DE CHECKOUT (ENVÍO Y PAGO) -->
  <div class="checkout-modal" id="checkoutModal">
    <div class="checkout-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="font-weight:900;">ORDER CHECKOUT</h3>
        <button onclick="closeCheckout()" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div class="form-group">
        <label>Contact Email</label>
        <input type="email" placeholder="email@ejemplo.com">
      </div>

      <div class="form-group">
        <label>Shipping Address</label>
        <input type="text" placeholder="Street Address">
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>City</label>
          <input type="text" placeholder="City">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Zip Code</label>
          <input type="text" placeholder="ZIP Code">
        </div>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select>
          <option>Credit Card (Visa/Mastercard)</option>
          <option>Apple Pay / Google Pay</option>
          <option>Cash on Delivery / Zelle</option>
        </select>
      </div>

      <div class="form-group">
        <label>Card Details</label>
        <input type="text" placeholder="Card Number">
      </div>

      <button class="checkout-btn" style="background:#00ff88; margin-top:10px;" onclick="alert('¡Gracias por tu compra! Tu orden ha sido procesada.'); closeCheckout();">COMPLETE ORDER</button>
    </div>
  </div>

  <!-- TUERCA ADMIN -->
  <button class="admin-trigger" onclick="toggleAdminPanel()">⚙️</button>

  <div class="admin-panel" id="adminPanel">
    <h3 style="margin-bottom:15px; font-weight:900;">PANEL ADMIN</h3>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="adminPass" placeholder="Clave admin">
    </div>
    <div class="form-group">
      <label>Nombre Drop</label>
      <input type="text" id="prodName" placeholder="Ej. Baggy Denim">
    </div>
    <div class="form-group">
      <label>Precio (USD)</label>
      <input type="text" id="prodPrice" placeholder="Ej. $84.00">
    </div>
    <div class="form-group">
      <label>URL Imagen</label>
      <input type="text" id="prodImg" placeholder="https://...">
    </div>
    <button class="add-cart-btn" onclick="addNewProduct()">PUBLICAR DROP</button>
  </div>

  <script>
    // FONDO 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const count = 1000;
    const pos = new Float32Array(count * 3);
    for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 15;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: 0.03, color: 0xffffff });
    const points = new THREE.Points(geo, mat);
    scene.add(points);
    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    // POP-UP Y PANEL
    function closePopup() { document.getElementById('earlyAccessPopup').style.display = 'none'; }
    function toggleCart() { document.getElementById('cartDrawer').classList.toggle('open'); }
    function toggleAdminPanel() { document.getElementById('adminPanel').classList.toggle('open'); }
    function openCheckout() { document.getElementById('checkoutModal').style.display = 'flex'; }
    function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

    // CARRITO DE COMPRAS
    let cart = [];

    function addToCart(name, price, img, sizeId) {
      const size = document.getElementById(sizeId).value;
      cart.push({ name, price, img, size });
      updateCartUI();
      toggleCart();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      const container = document.getElementById('cartItemsContainer');
      container.innerHTML = '';
      let total = 0;

      cart.forEach((item, idx) => {
        const numPrice = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
        total += numPrice;

        container.innerHTML += `
          <div class="cart-item">
            <img src="${item.img}" class="cart-item-img">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>Talla: ${item.size}</p>
              <p style="color:#fff; font-weight:bold; margin-top:2px;">${item.price}</p>
            </div>
          </div>
        `;
      });

      document.getElementById('cartSubtotal').innerText = `$${total.toFixed(2)} USD`;
    }

    // CARGAR PRODUCTOS DESDE EL BACKEND
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        if(data.products) {
          data.products.forEach((prod, i) => {
            const parts = prod.split(' | ');
            const name = parts[0] || 'Drop Item';
            const price = parts[1] || '$0.00';
            const img = parts[2] || 'https://via.placeholder.com/300x300/111/fff?text=GRAND+HUSTLES';

            grid.innerHTML += `
              <div class="product-card">
                <div>
                  <div class="img-box"><img src="${img}"></div>
                  <div class="prod-title">${name}</div>
                  <div class="prod-price">${price} USD</div>
                  <select class="size-select" id="size-${i}">
                    <option value="S / 28">SELECT SIZE: 28 / S</option>
                    <option value="M / 30">SELECT SIZE: 30 / M</option>
                    <option value="L / 32">SELECT SIZE: 32 / L</option>
                    <option value="XL / 34">SELECT SIZE: 34 / XL</option>
                    <option value="XXL / 36">SELECT SIZE: 36 / XXL</option>
                  </select>
                </div>
                <button class="add-cart-btn" onclick="addToCart('${name}', '${price}', '${img}', 'size-${i}')">ADD TO CART</button>
              </div>
            `;
          });
        }
      } catch(e) { console.error(e); }
    }

    async function addNewProduct() {
      const pass = document.getElementById('adminPass').value;
      const name = document.getElementById('prodName').value;
      const price = document.getElementById('prodPrice').value;
      const img = document.getElementById('prodImg').value;

      if(!pass || !name) return alert('Ingresa la contraseña y nombre del producto.');
      const fullProduct = `${name} | ${price || '$0.00'} | ${img}`;

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': pass },
        body: JSON.stringify({ product: fullProduct })
      });
      const data = await res.json();
      if(data.ok) {
        alert('Drop publicado');
        loadProducts();
      } else { alert('Error: ' + data.error); }
    }

    loadProducts();
  </script>
</body>
</html>

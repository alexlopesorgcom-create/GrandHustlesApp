<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAND HUSTLES - Streetwear Drops</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Three.js para gráficos 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Fondo 3D */
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ffffff, #888888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    p.subtitle {
      font-size: 1rem;
      color: #888;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 40px;
    }

    .card {
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 25px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 40px 0 rgba(255, 255, 255, 0.15);
    }

    .card h3 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .card p {
      color: #bbb;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .buy-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .buy-btn:hover {
      background: #dddddd;
    }

    /* Botón flotante Tuerca */
    .admin-trigger {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .admin-trigger:hover {
      transform: rotate(45deg) scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Panel Lateral Admin */
    .admin-panel {
      position: fixed;
      top: 0;
      right: -360px;
      width: 320px;
      height: 100vh;
      background: rgba(15, 15, 15, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      z-index: 99;
      padding: 30px 20px;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
      transition: right 0.4s ease;
      overflow-y: auto;
    }

    .admin-panel.open {
      right: 0;
    }

    .admin-panel h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .admin-group {
      margin-bottom: 18px;
    }

    .admin-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .admin-group input {
      width: 100%;
      padding: 10px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
    }

    .admin-btn {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .admin-btn:hover {
      background: #ccc;
    }

    .delete-list {
      margin-top: 25px;
      border-top: 1px solid #333;
      padding-top: 15px;
    }

    .delete-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .btn-del {
      background: #ff4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Fondo 3D -->
  <canvas id="canvas3d"></canvas>

  <div class="main-container">
    <header>
      <h1>GRAND HUSTLES</h1>
      <p class="subtitle">STREETWEAR & LIMITED DROPS</p>
    </header>

    <main class="grid-container" id="productsGrid">
      <!-- Los productos se cargan dinámicamente -->
    </main>
  </div>

  <!-- Botón Tuerca -->
  <button class="admin-trigger" onclick="toggleAdminPanel()">⚙️</button>

  <!-- Panel Desplegable Admin -->
  <div class="admin-panel" id="adminPanel">
    <h2>Panel Admin</h2>

    <div class="admin-group">
      <label>Contraseña Admin</label>
      <input type="password" id="adminPass" placeholder="Ingresa tu clave">
    </div>

    <div class="admin-group">
      <label>Nombre del Producto</label>
      <input type="text" id="prodName" placeholder="Ej. Cap Chucky Hats">
    </div>

    <div class="admin-group">
      <label>Precio (USD)</label>
      <input type="text" id="prodPrice" placeholder="Ej. $45">
    </div>

    <button class="admin-btn" onclick="addNewProduct()">Publicar Drop</button>

    <div class="delete-list">
      <h3 style="font-size: 1rem; margin-bottom: 12px;">Inventario Activo</h3>
      <div id="adminItemsList"></div>
    </div>
  </div>

  <!-- Script del Fondo 3D y Funcionalidad Admin -->
  <script>
    // --- FONDO 3D ---
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const geometry = new THREE.BufferGeometry();
    const count = 1200;
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 15;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      size: 0.035,
      color: 0xffffff,
      transparent: true,
      opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);
    camera.position.z = 5;

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
    });

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.0015;
      particles.rotation.x += 0.0008;
      camera.position.x += (mouseX - camera.position.x) * 0.05;
      camera.position.y += (-mouseY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- LÓGICA PANEL ADMIN Y TIENDA ---
    function toggleAdminPanel() {
      const panel = document.getElementById('adminPanel');
      panel.classList.toggle('open');
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        const grid = document.getElementById('productsGrid');
        const adminList = document.getElementById('adminItemsList');
        
        grid.innerHTML = '';
        adminList.innerHTML = '';

        if (data.products && data.products.length > 0) {
          data.products.forEach((prod, index) => {
            // Renderizar Card
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>${prod.split(' - ')[0] || prod}</h3>
              <p>${prod.split(' - ')[1] || ''}</p>
              <button class="buy-btn">Ver Drop</button>
            `;
            grid.appendChild(card);

            // Renderizar Lista Admin
            const adminItem = document.createElement('div');
            adminItem.className = 'delete-item';
            adminItem.innerHTML = `
              <span>${index + 1}. ${prod}</span>
              <button class="btn-del" onclick="deleteProduct(${index + 1})">Eliminar</button>
            `;
            adminList.appendChild(adminItem);
          });
        } else {
          grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No hay drops disponibles por ahora.</p>';
        }
      } catch (err) {
        console.error('Error cargando productos:', err);
      }
    }

    async function addNewProduct() {
      const pass = document.getElementById('adminPass').value;
      const name = document.getElementById('prodName').value;
      const price = document.getElementById('prodPrice').value;

      if (!pass) return alert('Por favor ingresa la contraseña.');
      if (!name) return alert('Ingresa el nombre de la prenda.');

      const fullProduct = price ? `${name} - ${price}` : name;

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': pass
          },
          body: JSON.stringify({ product: fullProduct })
        });

        const data = await res.json();
        if (data.ok) {
          alert('¡Producto agregado con éxito!');
          document.getElementById('prodName').value = '';
          document.getElementById('prodPrice').value = '';
          loadProducts();
        } else {
          alert('Error: ' + (data.error || 'Clave incorrecta'));
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    }

    async function deleteProduct(index) {
      const pass = document.getElementById('adminPass').value;
      if (!pass) return alert('Ingresa la contraseña en la casilla superior para eliminar.');

      try {
        const res = await fetch(`/api/products/${index}`, {
          method: 'DELETE',
          headers: {
            'x-api-key': pass
          }
        });

        const data = await res.json();
        if (data.ok) {
          loadProducts();
        } else {
          alert('Error: ' + (data.error || 'Clave incorrecta'));
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    }

    // Cargar productos al iniciar
    loadProducts();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Money Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo dinámico estilo aurora / estrellas */
        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(255, 75, 75, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(75, 150, 255, 0.1), transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-btn, .cart-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        /* Sección de productos con arrastre (Draggable) */
        .shop-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .product-slider {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Ocultar scroll en Firefox */
            cursor: grab;
            padding-bottom: 20px;
        }

        .product-slider::-webkit-scrollbar {
            display: none; /* Ocultar scroll en Chrome/Safari */
        }

        .product-slider:active {
            cursor: grabbing;
        }

        .product-card {
            flex: 0 0 280px;
            scroll-snap-align: start;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            transition: transform 0.3s ease;
        }

        .product-image-container {
            width: 100%;
            height: 280px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-container img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            pointer-events: none; /* Evita que la imagen interfiera con el drag */
            transition: transform 0.2s ease;
        }

        .product-info {
            margin-top: 15px;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            color: #aaa;
            font-size: 0.9rem;
        }

        .product-price span {
            color: #fff;
            font-weight: 700;
            margin-left: 8px;
        }

        /* Panel Admin Oculto (Estilo Modal Secreto) */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            padding: 40px;
        }

        .admin-content {
            max-width: 600px;
            margin: 0 auto;
            background: #111;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 10px;
        }

        .admin-content h2 {
            margin-bottom: 20px;
        }

        .admin-content input, .admin-content button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }

        .admin-content button {
            background: #fff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="logo">FAST MONEY</div>
        <button class="cart-btn" onclick="toggleCart()">🛒</button>
    </header>

    <main class="shop-container">
        <h2 class="section-title">Featured products</h2>
        
        <!-- Contenedor con capacidad de arrastre (Drag to Scroll) -->
        <div class="product-slider" id="slider">
            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="T-shirt">
                </div>
                <div class="product-info">
                    <div class="product-name">I'm a star t-shirt</div>
                    <div class="product-price"><del>$45.00 USD</del> <span>$40.00 USD</span></div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500" alt="T-shirt">
                </div>
                <div class="product-info">
                    <div class="product-name">All eyes on me t-shirt</div>
                    <div class="product-price"><del>$45.00 USD</del> <span>$40.00 USD</span></div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=500" alt="T-shirt">
                </div>
                <div class="product-info">
                    <div class="product-name">Fast money black tee</div>
                    <div class="product-price"><del>$45.00 USD</del> <span>$40.00 USD</span></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Panel Admin Oculto (Se activa con una combinación de teclas o comando secreto) -->
    <div id="admin-panel">
        <div class="admin-content">
            <h2>Panel de Administración Oculto</h2>
            <p style="margin-bottom: 15px; color: #888; font-size: 0.9rem;">Área protegida contra accesos no autorizados.</p>
            <input type="password" id="admin-pass" placeholder="Contraseña de administrador">
            <button onclick="verifyAdmin()">Acceder al Panel</button>
            <button onclick="closeAdmin()" style="background: #333; color: #fff;">Cerrar</button>
        </div>
    </div>

    <script>
        // Lógica de Arrastre Fluido (Drag to Scroll) para el slider
        const slider = document.getElementById('slider');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.classList.add('active');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('mouseleave', () => {
            isDown = false;
        });

        slider.addEventListener('mouseup', () => {
            isDown = false;
        });

        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // Velocidad de arrastre
            slider.scrollLeft = scrollLeft - walk;
        });

        // Soporte táctil para celulares
        slider.addEventListener('touchstart', (e) => {
            startX = e.touches[0].pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('touchmove', (e) => {
            const x = e.touches[0].pageX - slider.offsetLeft;
            const walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
        });

        // Activador secreto del Panel Admin (Presionar la tecla 'Control' + 'M' tres veces o una combinación específica)
        let secretKeySequence = [];
        const targetSequence = ['Control', 'm'];

        window.addEventListener('keydown', (e) => {
            secretKeySequence.push(e.key);
            if (secretKeySequence.slice(-2).join('+') === 'Control+m' || (e.ctrlKey && e.key === 'm')) {
                document.getElementById('admin-panel').style.display = 'block';
            }
        });

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            // Aquí puedes configurar tu clave segura cifrada o validación backend
            if (pass === "tu_clave_secreta_2026") { 
                alert("Acceso concedido. Cargando panel de control...");
                // Redirigir o mostrar opciones de administración avanzadas
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function toggleMenu() {
            alert("Menú lateral desplegable activado.");
        }

        function toggleCart() {
            alert("Carrito desplegado.");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAND HUSTLES - Streetwear Drops</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Cargar Three.js para gráficos 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Lienzo 3D de fondo */
    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Contenido encima del 3D */
    .main-container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ffffff, #888888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    p.subtitle {
      font-size: 1rem;
      color: #888;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 40px;
    }

    .card {
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 25px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 40px 0 rgba(255, 255, 255, 0.15);
    }

    .card h3 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .card p {
      color: #bbb;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .buy-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .buy-btn:hover {
      background: #dddddd;
      transform: scale(1.02);
    }

    /* Botón flotante para Admin */
    .admin-trigger {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.3s ease;
    }

    .admin-trigger:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Fondo 3D con Three.js -->
  <canvas id="canvas3d"></canvas>

  <div class="main-container">
    <header>
      <h1>GRAND HUSTLES</h1>
      <p class="subtitle">STREETWEAR & LIMITED DROPS</p>
    </header>

    <main class="grid-container" id="productsGrid">
      <div class="card">
        <h3>Hellstar Tee</h3>
        <p>$120.00 USD</p>
        <button class="buy-btn">Ver Drop</button>
      </div>

      <div class="card">
        <h3>BAPE Sta Tee</h3>
        <p>$110.00 USD</p>
        <button class="buy-btn">Ver Drop</button>
      </div>

      <div class="card">
        <h3>Cap Collection (Barbas/Chucky)</h3>
        <p>$45.00 USD</p>
        <button class="buy-btn">Ver Drop</button>
      </div>

      <div class="card">
        <h3>Limited Drop Hoodie</h3>
        <p>$150.00 USD</p>
        <button class="buy-btn">Ver Drop</button>
      </div>
    </main>
  </div>

  <button class="admin-trigger" onclick="alert('Panel Admin')">⚙️</button>

  <!-- Script del Fondo 3D Interactivo -->
  <script>
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Crear sistema de partículas en 3D
    const geometry = new THREE.BufferGeometry();
    const count = 1200;
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 15;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      size: 0.035,
      color: 0xffffff,
      transparent: true,
      opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    camera.position.z = 5;

    // Movimiento interactivo con el ratón / toque
    let mouseX = 0;
    let mouseY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
    });

    // Bucle de animación 3D
    function animate() {
      requestAnimationFrame(animate);

      particles.rotation.y += 0.0015;
      particles.rotation.x += 0.0008;

      camera.position.x += (mouseX - camera.position.x) * 0.05;
      camera.position.y += (-mouseY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    animate();

    // Reajustar en cambio de tamaño de pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

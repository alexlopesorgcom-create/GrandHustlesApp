<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hustles | Official Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #1f1f1f;
        }

        .logo {
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        nav a {
            color: #888;
            text-decoration: none;
            margin-left: 16px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #fff;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .badge {
            background-color: #1f1f1f;
            color: #ccc;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        p {
            color: #888;
            font-size: 0.95rem;
            max-width: 400px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #f1f1f1;
            color: #000;
        }

        .btn-primary:hover {
            background-color: #fff;
        }

        .btn-secondary {
            background-color: transparent;
            color: #fff;
            border: 1px solid #333;
        }

        .btn-secondary:hover {
            border-color: #666;
        }

        footer {
            padding: 24px;
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            border-top: 1px solid #1f1f1f;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GRAND HUSTLES</div>
        <nav>
            <a href="#" class="active">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="badge">Official Store</div>
        <h1>Elevate Your Style</h1>
        <p>Descubre la nueva colección exclusiva. Diseños únicos con la mejor calidad urbana.</p>
        
        <div class="btn-container">
            <a href="#" class="btn btn-primary">Ver Productos</a>
            <a href="#" class="btn btn-secondary">Saber Más</a>
        </div>
    </main>

    <footer>
        &copy; 2026 Grand Hustles. Todos los derechos reservados.
    </footer>

</body>
</html>
